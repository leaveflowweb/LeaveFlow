<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | LeaveFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><nav class="navbar bg-white"><div class="container py-2"><a class="navbar-brand brand" href="index.html"><span class="brand-mark"><i class="bi bi-calendar2-check"></i></span> Leave<span>Flow</span></a><button class="btn btn-language ms-auto" data-language-toggle>العربية</button></div></nav>
<main class="auth-wrap"><section class="auth-card register-card"><div class="auth-icon"><i class="bi bi-person-plus"></i></div><h1 data-i18n="createAccount">Create an account</h1><p data-i18n="registerSubtitle">Enter your employee details to get started.</p><div id="formAlert"></div>
<form id="registerForm"><div class="row g-3"><div class="col-md-6"><label class="form-label" data-i18n="fullName">Full name</label><input class="form-control" id="fullName" required></div><div class="col-md-6"><label class="form-label" data-i18n="employeeId">Employee ID</label><input class="form-control" id="employeeId" required></div><div class="col-md-6"><label class="form-label" data-i18n="department">Department</label><select class="form-select" id="department" required><option value="">Select department</option><option>IT</option><option>Business</option><option>Engineering</option></select></div><div class="col-md-6"><label class="form-label" data-i18n="email">Email</label><input class="form-control" id="email" type="email" required></div><div class="col-md-6"><label class="form-label" data-i18n="username">Username</label><input class="form-control" id="username" required autocomplete="username"></div><div class="col-md-6"><label class="form-label" data-i18n="password">Password</label><input class="form-control" id="password" type="password" minlength="6" required autocomplete="new-password"></div></div><button class="btn btn-primary w-100 btn-lg mt-4" type="submit" data-i18n="register">Create account</button></form>
<p class="auth-bottom"><span data-i18n="haveAccount">Already have an account?</span> <a href="login.html" data-i18n="login">Log in</a></p></section></main>
<script src="js/language.js"></script><script src="js/auth.js"></script></body></html>
