<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | LeaveFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><nav class="navbar bg-white"><div class="container py-2"><a class="navbar-brand brand" href="index.html"><span class="brand-mark"><i class="bi bi-calendar2-check"></i></span> Leave<span>Flow</span></a><button class="btn btn-language ms-auto" data-language-toggle>العربية</button></div></nav>
<main class="auth-wrap"><section class="auth-card"><div class="auth-icon"><i class="bi bi-person-check"></i></div><h1 data-i18n="loginTitle">Welcome back</h1><p data-i18n="loginSubtitle">Log in to view your leave dashboard.</p><div id="formAlert"></div>
<form id="loginForm"><div class="mb-3"><label class="form-label" for="username" data-i18n="username">Username</label><input class="form-control" id="username" required autocomplete="username" placeholder="Enter your username"></div><div class="mb-3"><label class="form-label" for="password" data-i18n="password">Password</label><input class="form-control" id="password" type="password" required autocomplete="current-password" placeholder="Enter your password"></div><button class="btn btn-primary w-100 btn-lg mt-2" type="submit" data-i18n="login">Log in</button></form>
<p class="auth-bottom"><span data-i18n="noAccount">Don't have an account?</span> <a href="register.html" data-i18n="registerHere">Register here</a></p><div class="demo-hint"><b data-i18n="demoAccount">Demo account</b><br>Username: <code>demo</code> · Password: <code>demo123</code></div></section></main>
<script src="js/language.js"></script><script src="js/auth.js"></script></body></html>
